[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cikm2026-meg"
version = "0.1.0"
description = "MEG-RW preprocessing + RecBole integration for CIKM 2026"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21",
  "scipy>=1.7",
  "pandas>=1.3",
  "pyyaml>=6.0",
  "torch>=2.0",
  "recbole>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
cikm-train = "cikm_train.run_experiment:main"

[tool.setuptools.packages.find]
where = ["src"]
